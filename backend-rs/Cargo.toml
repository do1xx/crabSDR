[workspace]
resolver = "2"
members = [
    "crates/crabsdr-core",
    "crates/crabsdr-dsp",
    "crates/crabsdr-sdr",
    "crates/crabsdr-server",
    "crates/crabsdr-auth",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# DSP
rustfft = "6"
num-complex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Compression
zstd = "0.13"

# Audio encoding
opus = "0.3"

# Parallelism
rayon = "1"

# Buffer management
bytes = "1"

# WebSocket client (for tunnel)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"

# HTTP-Client (Meldung ans Verzeichnis crabsdr.de), rustls wie der Tunnel
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Internal crates
crabsdr-core = { path = "crates/crabsdr-core" }
crabsdr-dsp = { path = "crates/crabsdr-dsp" }
crabsdr-sdr = { path = "crates/crabsdr-sdr" }
crabsdr-server = { path = "crates/crabsdr-server" }
crabsdr-auth = { path = "crates/crabsdr-auth" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
