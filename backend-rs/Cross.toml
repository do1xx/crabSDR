# Cross-compilation config for `cross` (https://github.com/cross-rs/cross).
# Builds crabsdr-server for the Odroid XU4 (armv7l) from a fast x86_64 Linux box
# with Docker, instead of the slow ~11 min native build on the XU4 itself.
#
#   cd backend-rs
#   cross build --release --target armv7-unknown-linux-gnueabihf
#
# The pre-build hooks add the armhf C libraries crabsdr links against
# (libopus for audio, libssl for openssl-sys) into the cross container.

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture armhf",
    "apt-get update",
    "apt-get install -y pkg-config libopus-dev:armhf libssl-dev:armhf",
]

[target.armv7-unknown-linux-gnueabihf.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig",
]
