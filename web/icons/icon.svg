<svg xmlns="http://www.w3.org/2000/svg" viewBox="116 -20 260 260" width="260" height="260">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crab centered -->
  <g transform="translate(250, 105) scale(0.7)">
    <!-- Legs -->
    <g opacity="0.8">
      <polygon points="-70,30 -115,60 -110,54 -65,27" fill="#047857"/>
      <polygon points="-80,40 -125,65 -120,59 -75,37" fill="#065f46"/>
      <polygon points="-75,50 -118,76 -113,71 -70,46" fill="#065f46"/>
      <polygon points="70,30 115,60 110,54 65,27" fill="#047857"/>
      <polygon points="80,40 125,65 120,59 75,37" fill="#065f46"/>
      <polygon points="75,50 118,76 113,71 70,46" fill="#065f46"/>
    </g>
    <!-- Left claw -->
    <polygon points="-85,0 -125,-22 -120,-13 -80,5" fill="#10b981"/>
    <polygon points="-125,-22 -155,-42 -150,-34 -120,-16" fill="#34d399"/>
    <polygon points="-155,-42 -168,-55 -163,-50 -150,-38" fill="#6ee7b7"/>
    <polygon points="-125,-22 -150,-27 -145,-21 -120,-16" fill="#059669"/>
    <circle cx="-168" cy="-55" r="3" fill="#fff" opacity="0.9" filter="url(#glowBig)"/>
    <circle cx="-168" cy="-55" r="1.5" fill="#fff"/>
    <!-- Right claw -->
    <polygon points="85,0 125,-22 120,-13 80,5" fill="#10b981"/>
    <polygon points="125,-22 155,-40 150,-32 120,-16" fill="#34d399"/>
    <polygon points="125,-22 150,-27 145,-21 120,-16" fill="#059669"/>
    <!-- Mini yagi -->
    <g transform="translate(153,-36) rotate(-20) scale(0.7)">
      <rect x="-1.5" y="-30" width="3" height="60" fill="#8899aa" rx="1"/>
      <rect x="-14" y="-28" width="28" height="2" fill="#aabbcc" rx="1"/>
      <rect x="-12" y="-18" width="24" height="2" fill="#aabbcc" rx="1"/>
      <rect x="-10" y="-8" width="20" height="2" fill="#aabbcc" rx="1"/>
      <rect x="-9" y="2" width="18" height="2" fill="#aabbcc" rx="1"/>
      <rect x="-8" y="12" width="16" height="2" fill="#aabbcc" rx="1"/>
      <rect x="-7" y="22" width="14" height="2" fill="#aabbcc" rx="1"/>
      <circle cx="0" cy="-8" r="2.5" fill="#fff" opacity="0.7" filter="url(#glow)"/>
    </g>
    <!-- Body -->
    <polygon points="-90,10 -70,-30 -30,-55 0,-60 30,-55 70,-30 90,10 70,50 30,60 -30,60 -70,50" fill="#047857"/>
    <polygon points="0,-60 -30,-55 0,-35" fill="#6ee7b7"/>
    <polygon points="0,-60 30,-55 0,-35" fill="#34d399"/>
    <polygon points="-30,-55 -70,-30 -40,-20" fill="#10b981"/>
    <polygon points="-30,-55 -40,-20 0,-35" fill="#34d399"/>
    <polygon points="30,-55 70,-30 40,-20" fill="#10b981"/>
    <polygon points="30,-55 40,-20 0,-35" fill="#34d399"/>
    <polygon points="-70,-30 -90,10 -55,5" fill="#059669"/>
    <polygon points="-70,-30 -55,5 -40,-20" fill="#10b981"/>
    <polygon points="-40,-20 -55,5 0,0" fill="#34d399"/>
    <polygon points="-40,-20 0,-35 0,0" fill="#6ee7b7"/>
    <polygon points="0,-35 40,-20 0,0" fill="#6ee7b7"/>
    <polygon points="40,-20 55,5 0,0" fill="#34d399"/>
    <polygon points="70,-30 90,10 55,5" fill="#059669"/>
    <polygon points="70,-30 55,5 40,-20" fill="#10b981"/>
    <polygon points="-90,10 -70,50 -55,5" fill="#047857"/>
    <polygon points="-55,5 -70,50 -30,35" fill="#059669"/>
    <polygon points="-55,5 -30,35 0,0" fill="#10b981"/>
    <polygon points="0,0 -30,35 0,45" fill="#059669"/>
    <polygon points="0,0 0,45 30,35" fill="#059669"/>
    <polygon points="0,0 30,35 55,5" fill="#10b981"/>
    <polygon points="55,5 30,35 70,50" fill="#059669"/>
    <polygon points="55,5 70,50 90,10" fill="#047857"/>
    <polygon points="-70,50 -30,60 -30,35" fill="#065f46"/>
    <polygon points="-30,60 30,60 0,45" fill="#047857"/>
    <polygon points="-30,60 0,45 -30,35" fill="#065f46"/>
    <polygon points="30,60 0,45 30,35" fill="#065f46"/>
    <polygon points="30,60 70,50 30,35" fill="#065f46"/>
    <!-- Eyes -->
    <polygon points="-30,-55 -38,-76 -34,-74 -25,-55" fill="#059669"/>
    <polygon points="30,-55 38,-76 34,-74 25,-55" fill="#059669"/>
    <circle cx="-36" cy="-79" r="9" fill="#0a0e1a"/>
    <circle cx="-36" cy="-79" r="6" fill="#122838"/>
    <circle cx="-36" cy="-79" r="4" fill="#fff"/>
    <circle cx="-34" cy="-81" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="36" cy="-79" r="9" fill="#0a0e1a"/>
    <circle cx="36" cy="-79" r="6" fill="#122838"/>
    <circle cx="36" cy="-79" r="4" fill="#fff"/>
    <circle cx="38" cy="-81" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="-36" cy="-79" r="5" fill="#fff" opacity="0.12" filter="url(#glowBig)"/>
    <circle cx="36" cy="-79" r="5" fill="#fff" opacity="0.12" filter="url(#glowBig)"/>
  </g>

  <!-- Text centered below crab -->

  <!-- Subtle underline -->
  <line x1="130" y1="278" x2="370" y2="278" stroke="#10b981" stroke-width="1" opacity="0.2"/>
</svg>
